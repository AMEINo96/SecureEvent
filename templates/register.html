{% extends "base.html" %}
{% block title %}Register – SecureEvent{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <h1 class="text-2xl font-bold text-gray-900 mb-1">Create account</h1>
      <p class="text-sm text-gray-500 mb-6">SecureEvent – CS-353 Demo</p>

      {% if error %}
      <div class="bg-red-50 border border-red-300 text-red-700 rounded-lg px-4 py-3 text-sm mb-5">
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="/register" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Full name</label>
          <input type="text" name="name" required maxlength="80"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" name="email" required maxlength="120"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input type="password" name="password" required minlength="8"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <p class="text-xs text-gray-400 mt-1">8+ chars, one uppercase, one digit</p>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
          <select name="role"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="student">Student</option>
            <option value="organizer">Organizer</option>
          </select>
        </div>
        <button type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg transition mt-2">
          Create account
        </button>
      </form>

      <p class="text-sm text-center text-gray-500 mt-5">
        Already registered? <a href="/login" class="text-indigo-600 font-medium hover:underline">Sign in</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
